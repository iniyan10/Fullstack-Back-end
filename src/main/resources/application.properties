spring.application.name=ecommerce-backend
server.port=8080

# ---- MySQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:iniyan}

# Tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# Base64 secret, at least 32 bytes. CHANGE THIS for any real deployment (set JWT_SECRET).
app.jwt.secret=${JWT_SECRET:TSbhxFGBn5ZrBgHCCMIrbWpdJId4+gitmGY9GQH4ucPV+k0hIG+6dKM+LiWXIQKl}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (React dev server) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# ---- Seed admin account (created on first start only) ----
app.admin.name=${ADMIN_NAME:Platform Admin}
app.admin.email=${ADMIN_EMAIL:admin@powerhouse.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---- Payments ----
# Highest order total allowed for Cash on Delivery (rupees)
app.payment.cod-limit=${COD_LIMIT:50000}
